name: Update Google Scholar Citation Total

on:
  schedule:
    # Daily at 10:17 Beijing time (02:17 UTC).
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-total:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Scholar publications
        uses: sxlllslgh/google-scholar-fetcher@4a30641f7dab085f01f99c38d38069d8aec2496f
        with:
          google-scholar-id: r9f4mLMAAAAJ
          record-file: /tmp/scholar-record.json

      - name: Update total citation count
        run: python3 google_scholar_crawler/update_total.py /tmp/scholar-record.json --root .

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -- \
            results/gs_data.json \
            _data/scholar.json \
            google_scholar_crawler/results/gs_data.json \
            results/gs_data_shieldsio.json \
            google_scholar_crawler/results/gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto update Google Scholar citation total"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
