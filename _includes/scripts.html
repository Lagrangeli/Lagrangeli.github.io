<script>
  (function() {
    var storageKey = "preferred-language";
    var supported = { en: true, zh: true };
    var root = document.documentElement;

    function getPreferredLanguage() {
      var params = new URLSearchParams(window.location.search);
      var fromQuery = params.get("lang");
      if (supported[fromQuery]) {
        return fromQuery;
      }

      try {
        var saved = localStorage.getItem(storageKey);
        if (supported[saved]) {
          return saved;
        }
      } catch (error) {}

      var browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      return browserLang.indexOf("zh") === 0 ? "zh" : "en";
    }

    function applyNavTranslations(language) {
      var navItems = document.querySelectorAll("[data-nav-title-en][data-nav-title-zh]");
      navItems.forEach(function(item) {
        item.textContent = item.getAttribute("data-nav-title-" + language);
      });
    }

    function applyDocumentTitle(language) {
      var pageMeta = document.querySelector("[data-page-title-en][data-page-title-zh]");
      if (!pageMeta) {
        return;
      }
      document.title = pageMeta.getAttribute("data-page-title-" + language);
    }

    function updateSwitcherState(language) {
      var buttons = document.querySelectorAll("[data-lang-switcher] [data-set-lang]");
      buttons.forEach(function(button) {
        var isActive = button.getAttribute("data-set-lang") === language;
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
        button.classList.toggle("is-active", isActive);
      });
    }

    function setLanguage(language) {
      if (!supported[language]) {
        return;
      }

      root.setAttribute("data-site-lang", language);
      root.setAttribute("lang", language === "zh" ? "zh-CN" : "en");
      applyNavTranslations(language);
      applyDocumentTitle(language);
      updateSwitcherState(language);

      try {
        localStorage.setItem(storageKey, language);
      } catch (error) {}

      document.dispatchEvent(new CustomEvent("site-language-change", {
        detail: { language: language }
      }));
    }

    document.addEventListener("click", function(event) {
      var button = event.target.closest("[data-set-lang]");
      if (!button) {
        return;
      }
      setLanguage(button.getAttribute("data-set-lang"));
    });

    setLanguage(getPreferredLanguage());
  })();
</script>

<script>
  (function() {
    var storageKey = "preferred-theme";
    var root = document.documentElement;
    var systemTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    function getStoredTheme() {
      try {
        var saved = localStorage.getItem(storageKey);
        return saved === "light" || saved === "dark" ? saved : null;
      } catch (error) {
        return null;
      }
    }

    function getLanguage() {
      return root.getAttribute("data-site-lang") === "zh" ? "zh" : "en";
    }

    function updateToggle(theme) {
      var toggle = document.querySelector("[data-theme-toggle]");
      if (!toggle) {
        return;
      }

      var switchTo = theme === "dark" ? "light" : "dark";
      var labels = {
        en: switchTo === "dark" ? "Switch to dark mode" : "Switch to light mode",
        zh: switchTo === "dark" ? "切换至深色模式" : "切换至浅色模式"
      };
      var label = labels[getLanguage()];

      toggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      toggle.setAttribute("aria-label", label);
      toggle.setAttribute("title", label);

      var hiddenLabel = toggle.querySelector("[data-theme-toggle-label]");
      if (hiddenLabel) {
        hiddenLabel.textContent = label;
      }
    }

    function applyTheme(theme, persist) {
      root.setAttribute("data-theme", theme);
      updateToggle(theme);

      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute("content", theme === "dark" ? "#111418" : "#ffffff");
      }

      if (persist) {
        try {
          localStorage.setItem(storageKey, theme);
        } catch (error) {}
      }
    }

    document.addEventListener("click", function(event) {
      var toggle = event.target.closest("[data-theme-toggle]");
      if (!toggle) {
        return;
      }

      var current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      applyTheme(current === "dark" ? "light" : "dark", true);
    });

    document.addEventListener("site-language-change", function() {
      updateToggle(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
    });

    window.addEventListener("storage", function(event) {
      if (event.key === storageKey && (event.newValue === "light" || event.newValue === "dark")) {
        applyTheme(event.newValue, false);
      }
    });

    if (systemTheme) {
      var handleSystemThemeChange = function(event) {
        if (!getStoredTheme()) {
          applyTheme(event.matches ? "dark" : "light", false);
        }
      };

      if (systemTheme.addEventListener) {
        systemTheme.addEventListener("change", handleSystemThemeChange);
      } else if (systemTheme.addListener) {
        systemTheme.addListener(handleSystemThemeChange);
      }
    }

    applyTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);
  })();
</script>

<script>
  (function() {
    function closeWechatPanels() {
      var toggles = document.querySelectorAll("[data-wechat-toggle]");
      toggles.forEach(function(toggle) {
        toggle.setAttribute("aria-expanded", "false");
      });

      var panels = document.querySelectorAll(".author__wechat-panel");
      panels.forEach(function(panel) {
        panel.hidden = true;
      });
    }

    document.addEventListener("click", function(event) {
      var toggle = event.target.closest("[data-wechat-toggle]");
      if (!toggle) {
        if (!event.target.closest(".author__wechat-panel")) {
          closeWechatPanels();
        }
        return;
      }

      event.preventDefault();
      var panel = document.getElementById(toggle.getAttribute("aria-controls"));
      if (!panel) {
        return;
      }

      var shouldOpen = toggle.getAttribute("aria-expanded") !== "true";
      closeWechatPanels();
      toggle.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
      panel.hidden = !shouldOpen;
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeWechatPanels();
      }
    });
  })();
</script>
